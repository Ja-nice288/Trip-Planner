<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Planner</title>
<style>
:root{--bg:#fff7ec;--card:#fff;--ink:#2b2350;--mute:#7d7a99;--line:#f0e3d0;--p1:#6c5ce7;--p2:#00b8a9;--p3:#ff6b6b;--p4:#ffb703;--soft:#efeaff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1633;--card:#262049;--ink:#f4f0ff;--mute:#a9a4cc;--line:#3a3366;--soft:#342d62;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1633;--card:#262049;--ink:#f4f0ff;--mute:#a9a4cc;--line:#3a3366;--soft:#342d62;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 90px}
button{font:inherit;color:inherit;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--p1),var(--p3) 60%,var(--p4));color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}
.hero h1{margin:0;font-size:26px}
.hero .sub{opacity:.9;font-size:14px}
.hero .big{font-size:30px;font-weight:800;margin-top:6px}
.btn{background:var(--p1);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700}
.btn.ghost{background:var(--soft);color:var(--p1)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.w{width:100%}
.ic{background:none;border:0;padding:4px 8px;color:var(--mute);font-size:15px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.trip{cursor:pointer;border-left:6px solid var(--c)}
.trip .t{font-size:18px;font-weight:800}
.mute{color:var(--mute);font-size:14px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700;color:#fff;background:var(--c)}
.two{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.top h1{flex:1;margin:0;font-size:22px}
.tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin:10px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:11px;font-weight:700;color:var(--mute)}
.tabs button.on{background:var(--p1);color:#fff}
.day{border-left:4px solid var(--c);margin-left:4px;padding-left:12px;margin-bottom:10px}
.dh{display:flex;align-items:center;gap:8px;margin:6px 0}
.dh b{background:var(--c);color:#fff;border-radius:20px;padding:2px 12px}
.spot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.n{display:flex;gap:6px;align-items:center;font-weight:700}
.sp{flex:1}
.cost{color:var(--p3);font-weight:800}
.tr{font-size:14px;color:var(--p2);margin-top:4px;font-weight:600}
.ph{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.ph img{height:84px;width:auto;border-radius:10px;flex:none}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.bar{height:10px;border-radius:5px;background:var(--soft);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:5px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
#mask{position:fixed;inset:0;background:rgba(20,10,50,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#mask.on{display:flex}
#sheet{background:var(--card);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:40;font-weight:600}
.hd{touch-action:none;cursor:grab;color:var(--mute);font-size:20px;padding:0 4px;user-select:none;-webkit-user-select:none}
.dghost{position:fixed;z-index:30;pointer-events:none;background:var(--p1);color:#fff;padding:6px 12px;border-radius:12px;font-weight:700;transform:translate(-50%,-130%);opacity:.92}
.over{background:var(--soft);border-radius:12px}
.chk{width:32px;height:32px;border-radius:50%;border:2px solid var(--p2);background:none;color:transparent;font-weight:800;flex:none;padding:0}
.chk.on{background:var(--p2);color:#fff}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:12px;flex:none}
.done{text-decoration:line-through;opacity:.55}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{letter-spacing:.1px}
.hero{box-shadow:0 14px 30px rgba(108,92,231,.28)}
.card{box-shadow:0 4px 14px rgba(43,35,80,.06);transition:transform .18s ease,box-shadow .18s ease}
.trip:active{transform:scale(.985);box-shadow:0 2px 8px rgba(43,35,80,.1)}
.btn{transition:transform .15s ease,filter .15s ease;box-shadow:0 6px 16px rgba(108,92,231,.25)}
.btn.ghost{box-shadow:none}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.tabs button{transition:background .2s ease,color .2s ease}
#mask{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#sheet{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.tlabel{margin:22px 4px 8px;font-weight:700;color:var(--mute);font-size:14px}
.tools{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 22px rgba(108,92,231,.1)}
.tool{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 14px;text-align:left;transition:background .15s ease}
.tool:last-child{border:0}
.tool:active{background:var(--soft)}
.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:color-mix(in srgb,var(--c) 18%,transparent)}
.tx{flex:1;display:flex;flex-direction:column;line-height:1.3}
.tx small{color:var(--mute);font-size:13px}
.tool i{color:var(--mute);font-style:normal;font-size:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--bg:#faf6f4;--card:#fffdfc;--ink:#3d3335;--mute:#8d7f80;--line:#efe4e1;--p1:#b07a73;--p2:#8c9bab;--p3:#c07a6c;--p4:#bfa06a;--soft:#f6ecea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1415;--card:#251c1e;--ink:#f3e8e8;--mute:#b09fa1;--line:#3b2d30;--soft:#2e2326;--p1:#d4a39a;--p2:#a9b6c4;--p3:#e0a095;--p4:#d6bb86}.btn:not(.ghost),.tabs button.on{color:#1a1415}}
:root[data-theme="dark"]{--bg:#1a1415;--card:#251c1e;--ink:#f3e8e8;--mute:#b09fa1;--line:#3b2d30;--soft:#2e2326;--p1:#d4a39a;--p2:#a9b6c4;--p3:#e0a095;--p4:#d6bb86}
.hero{background:linear-gradient(135deg,#f7e9e6,#ecd2cd);color:#3d3335;box-shadow:0 8px 20px rgba(176,122,115,.15)}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(135deg,#3b2b2e,#55393d);color:#f3e8e8}}
.hero h1,.hero .big,.trip .t{font-weight:700}
.cost{font-weight:700}
.card{box-shadow:0 1px 3px rgba(61,51,53,.06)}
.btn{box-shadow:none}
.tools{box-shadow:0 1px 3px rgba(61,51,53,.06)}
.tabs button.on{box-shadow:0 1px 3px rgba(20,30,50,.15)}
</style>
</head>
<body>
<div id="app"></div>
<div id="mask"><div id="sheet"></div></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="file2" accept="image/*" hidden>
<input type="file" id="file3" accept=".json,application/json" hidden>
<div id="toast"></div>
<script>
const KEY='trip-planner-v1',RK='trip-planner-rates';
const CUR={SGD:['S$',1],MYR:['RM',.30],USD:['US$',1.30],JPY:['¥',.0087],CNY:['CN¥',.18],KRW:['₩',.00093],THB:['฿',.040],EUR:['€',1.50],GBP:['£',1.73],AUD:['A$',.85],HKD:['HK$',.167],TWD:['NT$',.041],IDR:['Rp',.000082],VND:['₫',.00005]};
const CTRY=[['Singapore','🇸🇬','SGD'],['Malaysia','🇲🇾','MYR'],['Japan','🇯🇵','JPY'],['South Korea','🇰🇷','KRW'],['China','🇨🇳','CNY'],['Hong Kong','🇭🇰','HKD'],['Taiwan','🇹🇼','TWD'],['Thailand','🇹🇭','THB'],['Indonesia','🇮🇩','IDR'],['Vietnam','🇻🇳','VND'],['Australia','🇦🇺','AUD'],['United Kingdom','🇬🇧','GBP'],['France','🇫🇷','EUR'],['Italy','🇮🇹','EUR'],['Germany','🇩🇪','EUR'],['Spain','🇪🇸','EUR'],['United States','🇺🇸','USD'],['Other (USD)','🌍','USD']];
const MODES=['Walk','Metro','Bus','Train','Taxi','Flight','Drive','Ferry','Other'];
const MI={Walk:'🚶',Metro:'🚇',Bus:'🚌',Train:'🚆',Taxi:'🚕',Flight:'✈️',Drive:'🚗',Ferry:'⛴️',Other:'🧭'};
const OLDM={'步行':'Walk','地铁':'Metro','巴士':'Bus','火车':'Train','打车':'Taxi','飞机':'Flight','自驾':'Drive','轮渡':'Ferry','其他':'Other'};
const OLDC={'餐饮':'Food','购物':'Souvenirs','门票':'Other','其他':'Other'};
const ECAT=['Flights','Accommodation','Food','Souvenirs','Other'];
const CI={Flights:'✈️',Accommodation:'🏨',Food:'🍜',Souvenirs:'🎁',Shopping:'🛍️',Attractions:'🎟️',Transport:'🚆',Other:'📦'};
const CC={Flights:'#8c9bab',Accommodation:'#b07a73',Food:'#bfa06a',Souvenirs:'#a8788a',Shopping:'#c0846f',Attractions:'#9a8a99',Transport:'#8aa08f',Other:'#aea3a1'};
const DC=['#b07a73','#8c9bab','#bfa06a','#9a8a99','#8aa08f','#c0846f','#a8788a','#7f95a3'];
let trips=[],rates={},cur=null,tab='plan',target=null;
try{trips=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
try{rates=JSON.parse(localStorage.getItem(RK)||'{}')}catch(e){}
trips.forEach(t=>{ t.shop=t.shop||[]; // migrate older data
  if(!t.code){t.code=Object.keys(CUR).find(k=>CUR[k][0]===t.cur)||'SGD';t.country=t.country||''}
  t.plan.forEach(d=>d.forEach(p=>{if(OLDM[p.mode])p.mode=OLDM[p.mode]}));
  t.exp.forEach(e=>{if(OLDC[e.cat])e.cat=OLDC[e.cat]});
});
const rate=c=>rates[c]!=null?+rates[c]:CUR[c][1];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(trips));localStorage.setItem(RK,JSON.stringify(rates))}catch(e){alert('Storage is full. Please delete some photos.')}};
const $=s=>document.querySelector(s);
window.alert=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',2500)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=()=>trips.find(t=>t.id===cur);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtN=(c,n)=>CUR[c][0]+(+n).toLocaleString(undefined,{maximumFractionDigits:['JPY','KRW','IDR','VND'].includes(c)?0:2});
const money=(t,n)=>fmtN(t.code,n||0);
const sgd=(t,n)=>fmtN('SGD',n*rate(t.code));
const fmt=c=>c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dateOf(t,i){if(!t.start)return'';const d=new Date(t.start+'T00:00:00');d.setDate(d.getDate()+i);return d.getDate()+' '+MON[d.getMonth()]}
const range=t=>t.start?dateOf(t,0)+' – '+dateOf(t,t.days-1):'';
const flag=t=>(CTRY.find(c=>c[0]===t.country)||[0,'🧳'])[1];
function sums(t){
  const s={Flights:0,Accommodation:0,Food:0,Souvenirs:0,Attractions:0,Transport:0,Other:0,Shopping:0};
  t.plan.forEach(d=>d.forEach(p=>{s.Attractions+=+p.cost||0;s.Transport+=+p.tcost||0}));
  t.hotels.forEach(h=>s.Accommodation+=+h.cost||0);
  t.exp.forEach(e=>s[e.cat]=(s[e.cat]||0)+(+e.amt||0));
  (t.shop||[]).forEach(x=>{if(x.done)s.Shopping+=+x.price||0});
  s.total=Object.values(s).reduce((a,b)=>a+b,0);return s;
}
function fit(t){while(t.plan.length<t.days)t.plan.push([]);if(t.plan.length>t.days){const x=t.plan.splice(t.days);t.plan[t.days-1]=t.plan[t.days-1].concat(...x)}}

function form(title,fields,ok,del){
  let h='<h2 style="margin:0">'+esc(title)+'</h2>';
  fields.forEach((f,i)=>{
    h+='<label>'+f.l+'</label>';const v=f.v==null?'':f.v;
    if(f.t==='select')h+='<select id="f'+i+'">'+f.o.map(o=>'<option value="'+esc(o)+'"'+(o===v?' selected':'')+'>'+(f.ic&&CI[o]?CI[o]+' ':'')+esc(o)+'</option>').join('')+'</select>';
    else if(f.t==='area')h+='<textarea id="f'+i+'" rows="2">'+esc(v)+'</textarea>';
    else h+='<input id="f'+i+'" type="'+(f.t||'text')+'" value="'+esc(v)+'"'+(f.t==='number'?' inputmode="decimal" step="any"':'')+' placeholder="'+esc(f.p||'')+'">';
  });
  h+='<div class="acts">'+(del?'<button class="btn ghost" id="fd" style="color:var(--p3)">Delete</button>':'')+'<button class="btn ghost" id="fc">Cancel</button><button class="btn" id="fo">Save</button></div>';
  $('#sheet').innerHTML=h;$('#mask').classList.add('on');
  $('#fc').onclick=close;
  if(del)$('#fd').onclick=function(){if(this.dataset.s){del();close()}else{this.dataset.s=1;this.textContent='Tap again to delete'}};
  $('#fo').onclick=()=>{const r=fields.map((f,i)=>$('#f'+i).value.trim());if(ok(r)===false)return;close()};
}
function close(){$('#mask').classList.remove('on');save();draw()}
$('#mask').onclick=e=>{if(e.target.id==='mask')close()};

function tripForm(t){
  const n=!t;
  form(n?'New trip':'Edit trip',[
    {l:'Trip name',v:t&&t.name,p:'e.g. Tokyo in spring'},
    {l:'Country (sets the currency)',t:'select',o:CTRY.map(c=>c[0]),v:t&&t.country||'Japan'},
    {l:'City / place',v:t&&t.dest,p:'e.g. Tokyo'},
    {l:'Start date',t:'date',v:t&&t.start},
    {l:'End date',t:'date',v:(()=>{if(!t||!t.start)return'';const d=new Date(t.start+'T00:00:00');d.setDate(d.getDate()+t.days-1);return fmt(d)})()}
  ],r=>{
    if(!r[0]){alert('Please enter a trip name');return false}
    if(!r[3]||!r[4]){alert('Please choose a start and end date');return false}
    const a=new Date(r[3]+'T00:00:00'),b=new Date(r[4]+'T00:00:00'),nd=Math.round((b-a)/864e5)+1;
    if(nd<1){alert('End date must be on or after the start date');return false}
    if(nd>60){alert('A trip can be up to 60 days');return false}
    const c=CTRY.find(x=>x[0]===r[1]),days=nd;
    if(n){const x={id:uid(),name:r[0],country:r[1],code:c[2],dest:r[2],start:r[3],days,plan:[],hotels:[],exp:[],shop:[]};fit(x);trips.unshift(x);cur=x.id;tab='plan'}
    else{Object.assign(t,{name:r[0],country:r[1],code:c[2],dest:r[2],start:r[3],days});fit(t)}
  },n?null:()=>{trips=trips.filter(x=>x.id!==t.id);cur=null});
}
function spotForm(d,i){
  const t=T(),p=i==null?null:t.plan[d][i];
  form(p?'Edit place':'Day '+(d+1)+' · Add place',[
    {l:'Place name',v:p&&p.name},{l:'Arrival time (optional)',t:'time',v:p&&p.time},
    {l:'Ticket / cost ('+t.code+')',t:'number',v:p&&p.cost},
    {l:'How to get there (optional)',t:'select',o:['None'].concat(MODES),v:p&&p.mode||'None'},
    {l:'Travel time (minutes)',t:'number',v:p&&p.tmin},{l:'Transport cost ('+t.code+')',t:'number',v:p&&p.tcost},
    {l:'Route notes',v:p&&p.route,p:'e.g. Yamanote Line to Shinjuku, exit 3'},{l:'Notes',t:'area',v:p&&p.note}
  ],r=>{
    if(!r[0]){alert('Please enter a place name');return false}
    const o={name:r[0],time:r[1],cost:r[2],mode:r[3]==='None'?'':r[3],tmin:r[4],tcost:r[5],route:r[6],note:r[7],photos:p?p.photos:[]};
    if(p)t.plan[d][i]=o;else t.plan[d].push(o);
  },p?()=>t.plan[d].splice(i,1):null);
}
function hotelForm(i){
  const t=T(),h=i==null?null:t.hotels[i];
  form(h?'Edit hotel':'Add hotel',[
    {l:'Hotel name',v:h&&h.name},{l:'Location / address',v:h&&h.addr},
    {l:'Check-in',t:'date',v:h?h.in:t.start},{l:'Check-out',t:'date',v:h&&h.out},
    {l:'Total cost ('+t.code+')',t:'number',v:h&&h.cost},{l:'Notes',v:h&&h.note,p:'Booking ref, breakfast…'}
  ],r=>{
    if(!r[0]){alert('Please enter a hotel name');return false}
    const o={name:r[0],addr:r[1],in:r[2],out:r[3],cost:r[4],note:r[5]};
    if(h)t.hotels[i]=o;else t.hotels.push(o);
  },h?()=>t.hotels.splice(i,1):null);
}
function expForm(i){
  const t=T(),e=i==null?null:t.exp[i];
  form(e?'Edit expense':'Add expense',[
    {l:'Category',t:'select',ic:1,o:ECAT,v:e&&e.cat||'Food'},
    {l:'Description',v:e&&e.name,p:'e.g. KL–Tokyo flights'},{l:'Amount ('+t.code+')',t:'number',v:e&&e.amt}
  ],r=>{
    if(!r[1]||!r[2]){alert('Please enter a description and amount');return false}
    const o={cat:r[0],name:r[1],amt:r[2]};
    if(e)t.exp[i]=o;else t.exp.push(o);
  },e?()=>t.exp.splice(i,1):null);
}
function rateForm(){
  const ks=Object.keys(CUR).filter(k=>k!=='SGD');
  form('Exchange rates → SGD',ks.map(k=>({l:'1 '+k+' = S$',t:'number',v:rate(k)})),r=>{
    ks.forEach((k,i)=>{if(r[i]&&+r[i]>0)rates[k]=+r[i]});
  });
}
function mv(d,i,k){const a=T().plan[d],j=i+k;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();draw()}
function addPhoto(d,i){target=[d,i];$('#file').click()}
function delPhoto(d,i,k){form('Photo',[],()=>{},()=>T().plan[d][i].photos.splice(k,1))}
$('#file').onchange=async e=>{
  const p=T().plan[target[0]][target[1]];p.photos=p.photos||[];
  for(const f of e.target.files){try{p.photos.push(await shrink(f))}catch(x){}}
  e.target.value='';save();draw();
};
function shrink(f){return new Promise((ok,no)=>{
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.6))};
  im.onerror=no;im.src=u})}
function open_(id){cur=id;tab='plan';draw();scrollTo(0,0)}
function setTab(x){tab=x;draw()}
/* backup & restore */
function restore(){document.getElementById('file3').click()}
async function backup(){
 const name='trip-planner-backup-'+fmt(new Date())+'.json',blob=new Blob([JSON.stringify({trips,rates})],{type:'application/json'}),f=new File([blob],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
$('#file3').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const d=JSON.parse(await f.text());if(!Array.isArray(d.trips))throw 0;
  d.trips.forEach(x=>{const i=trips.findIndex(t=>t.id===x.id);if(i>=0)trips[i]=x;else trips.push(x)});
  Object.assign(rates,d.rates||{});trips.forEach(t=>t.shop=t.shop||[]);save();draw();alert('Backup restored')}catch(x){alert('That file is not a valid backup')}};
/* drag a place to another day */
let drag=null;
$('#app').addEventListener('pointerdown',e=>{
 const h=e.target.closest('.hd');if(!h)return;e.preventDefault();
 const d=+h.dataset.d,i=+h.dataset.i,g=document.createElement('div');
 g.className='dghost';g.textContent=T().plan[d][i].name;document.body.appendChild(g);
 drag={d,i,g,x:e.clientX,y:e.clientY,t:setInterval(()=>{if(drag.y<90)scrollBy(0,-14);else if(drag.y>innerHeight-90)scrollBy(0,14)},30)};
 dmove(e);
});
function dmove(e){if(!drag)return;drag.x=e.clientX;drag.y=e.clientY;drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
 document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'));
 const el=document.elementFromPoint(e.clientX,e.clientY),dy=el&&el.closest('.day');if(dy)dy.classList.add('over')}
function dend(e){if(!drag)return;const{d,i,g,t}=drag;clearInterval(t);g.remove();drag=null;
 document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'));
 const el=document.elementFromPoint(e.clientX,e.clientY),dy=el&&el.closest('.day');if(!dy)return;
 const pl=T().plan,td=+dy.dataset.d,sp=el.closest('.spot');
 let ti=sp&&+sp.dataset.d===td?+sp.dataset.i:pl[td].length;
 const it=pl[d].splice(i,1)[0];if(td===d&&ti>i)ti--;pl[td].splice(ti,0,it);save();draw()}
addEventListener('pointermove',dmove);addEventListener('pointerup',dend);addEventListener('pointercancel',dend);
/* shopping list */
function shopForm(i){const t=T(),x=i==null?null:t.shop[i];
 form(x?'Edit item':'Add to shopping list',[{l:'Item',v:x&&x.name,p:'e.g. Matcha KitKat'},{l:'Price ('+t.code+')',t:'number',v:x&&x.price},{l:'Notes',v:x&&x.note,p:'Where to buy, size…'}],r=>{
  if(!r[0]){alert('Please enter an item name');return false}
  const o={name:r[0],price:r[1],note:r[2],done:x?x.done:false,photo:x?x.photo:''};
  if(x)t.shop[i]=o;else t.shop.push(o)},x?()=>t.shop.splice(i,1):null)}
function tick(i){const x=T().shop[i];x.done=!x.done;save();draw()}
function shopPhoto(i){target=i;$('#file2').click()}
$('#file2').onchange=async e=>{const f=e.target.files[0];if(f){try{T().shop[target].photo=await shrink(f)}catch(x){}}e.target.value='';save();draw()};
function shopV(t){
 const tot=t.shop.reduce((a,x)=>a+(+x.price||0),0),got=t.shop.filter(x=>x.done).reduce((a,x)=>a+(+x.price||0),0);
 let h='<div class="card"><div class="n"><span class="sp">Bought</span><b class="cost">'+money(t,got)+'</b></div><div class="n"><span class="sp mute">Still to buy</span><b>'+money(t,tot-got)+'</b></div><div class="mute" style="margin-top:4px">Ticked items are added to Costs.</div></div>';
 if(!t.shop.length)h+='<div class="empty">Your shopping list is empty</div>';
 t.shop.forEach((x,i)=>{
  h+='<div class="card"><div style="display:flex;gap:10px;align-items:center"><button class="chk'+(x.done?' on':'')+'" onclick="tick('+i+')">✓</button>'+(x.photo?'<img class="thumb" src="'+x.photo+'" alt="">':'')+
  '<div class="sp"><div class="n'+(x.done?' done':'')+'">'+esc(x.name)+'</div>'+(x.note?'<div class="mute">'+esc(x.note)+'</div>':'')+'</div><span class="cost">'+(+x.price?money(t,+x.price):'')+'</span></div>'+
  '<div style="margin-top:6px"><button class="ic" onclick="shopPhoto('+i+')">📷 '+(x.photo?'Change photo':'Add photo')+'</button><button class="ic" onclick="shopForm('+i+')">Edit</button></div></div>';
 });
 return h+'<button class="btn w" onclick="shopForm()">＋ Add item</button>';
}

function draw(){$('#app').innerHTML=cur&&T()?tripView(T()):home()}
function home(){
  const all=trips.reduce((a,t)=>a+sums(t).total*rate(t.code),0);
  let h='<div class="hero"><h1>🧳 My Trips</h1><div class="sub">'+trips.length+' trip'+(trips.length===1?'':'s')+' · total spent, converted to SGD</div><div class="big">'+fmtN('SGD',all)+'</div></div>';
  if(!trips.length)h+='<div class="empty">No trips yet.<br>Tap the button below to plan your first one.</div>';
  trips.forEach((t,i)=>{
    const s=sums(t).total;
    h+='<div class="card trip" style="--c:'+DC[i%DC.length]+'" onclick="open_(\''+t.id+'\')"><div class="t">'+flag(t)+' '+esc(t.name)+'</div><div class="mute">'+esc(t.dest||t.country)+' · '+t.days+' days'+(t.start?' · '+range(t):'')+'</div>'+
    '<div class="two"><span class="pill" style="--c:#b07a73">'+money(t,s)+'</span>'+(t.code!=='SGD'?'<span class="pill" style="--c:#8c9bab">≈ '+sgd(t,s)+'</span>':'')+'</div></div>';
  });
  return h+'<button class="btn w" onclick="tripForm()">＋ New trip</button><div class="tlabel">Settings &amp; data</div><div class="tools"><button class="tool" onclick="rateForm()"><span class="ti" style="--c:#8c9bab">💱</span><span class="tx"><b>Exchange rates</b><small>Monthly average to SGD</small></span><i>›</i></button><button class="tool" onclick="backup()"><span class="ti" style="--c:#b07a73">⬇️</span><span class="tx"><b>Back up data</b><small>Save all trips to a file</small></span><i>›</i></button><button class="tool" onclick="restore()"><span class="ti" style="--c:#bfa06a">⬆️</span><span class="tx"><b>Restore data</b><small>Load trips from a backup file</small></span><i>›</i></button></div>';
}
function tripView(t){
  let h='<div class="top"><button class="ic" onclick="cur=null;draw()">‹ Back</button><h1>'+flag(t)+' '+esc(t.name)+'</h1><button class="ic" onclick="tripForm(T())">Edit</button></div>';
  h+='<div class="mute">'+esc(t.dest||t.country)+' · '+t.days+' days'+(t.start?' · '+range(t):'')+' · '+t.code+'</div>';
  h+='<div class="tabs">'+[['plan','Itinerary'],['hotel','Hotels'],['shop','Shopping'],['cost','Costs']].map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div>';
  return h+(tab==='plan'?planV(t):tab==='hotel'?hotelV(t):tab==='shop'?shopV(t):costV(t));
}
function planV(t){
  let h='';
  t.plan.forEach((day,d)=>{
    let hot=null;
    if(t.start){const c=new Date(t.start+'T00:00:00');c.setDate(c.getDate()+d);const k=fmt(c);hot=t.hotels.find(x=>x.in&&x.out&&x.in<=k&&k<x.out)}
    h+='<div class="day" data-d="'+d+'" style="--c:'+DC[d%DC.length]+'"><div class="dh"><b>Day '+(d+1)+'</b><span class="mute">'+dateOf(t,d)+'</span></div>';
    if(hot)h+='<div class="mute" style="margin-bottom:6px">🏨 '+esc(hot.name)+'</div>';
    day.forEach((p,i)=>{
      h+='<div class="spot" data-d="'+d+'" data-i="'+i+'"><div class="n"><span class="hd" data-d="'+d+'" data-i="'+i+'">⠿</span><span class="sp">'+(p.time?'<span class="mute">'+esc(p.time)+'</span> ':'')+esc(p.name)+'</span>'+(+p.cost?'<span class="cost">'+money(t,+p.cost)+'</span>':'')+'</div>';
      if(p.mode)h+='<div class="tr">'+MI[p.mode]+' '+p.mode+(p.tmin?' · '+esc(p.tmin)+' min':'')+(+p.tcost?' · '+money(t,+p.tcost):'')+(p.route?'<br><span class="mute" style="font-weight:400">'+esc(p.route)+'</span>':'')+'</div>';
      if(p.note)h+='<div class="mute" style="margin-top:4px">'+esc(p.note)+'</div>';
      if(p.photos&&p.photos.length)h+='<div class="ph">'+p.photos.map((s,k)=>'<img src="'+s+'" alt="" onclick="delPhoto('+d+','+i+','+k+')">').join('')+'</div>';
      h+='<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:2px"><button class="ic" onclick="addPhoto('+d+','+i+')">📷 Add photo</button>'+
      '<a class="ic" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent((t.dest||t.country)+' '+p.name)+'">🔍 Find photos</a>'+
      '<button class="ic" onclick="mv('+d+','+i+',-1)">↑</button><button class="ic" onclick="mv('+d+','+i+',1)">↓</button><button class="ic" onclick="spotForm('+d+','+i+')">Edit</button></div></div>';
    });
    h+='<button class="btn ghost sm" onclick="spotForm('+d+')">＋ Add place</button></div>';
  });
  return h;
}
function hotelV(t){
  let h='';
  if(!t.hotels.length)h+='<div class="empty">No hotels added yet</div>';
  t.hotels.forEach((x,i)=>{
    h+='<div class="card"><div class="n"><span class="sp">🏨 '+esc(x.name)+'</span><span class="cost">'+(+x.cost?money(t,+x.cost):'')+'</span></div>'+
    '<div class="mute">'+esc(x.addr||'')+'</div><div class="mute">'+esc(x.in||'?')+' → '+esc(x.out||'?')+'</div>'+(x.note?'<div class="mute">'+esc(x.note)+'</div>':'')+
    '<div style="margin-top:6px">'+(x.addr?'<a class="ic" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.name+' '+x.addr)+'">📍 Map</a>':'')+'<button class="ic" onclick="hotelForm('+i+')">Edit</button></div></div>';
  });
  return h+'<button class="btn w" onclick="hotelForm()">＋ Add hotel</button>';
}
function costV(t){
  const s=sums(t);
  let h='<div class="hero"><div class="sub">Total spent</div><div class="big">'+money(t,s.total)+'</div>'+(t.code!=='SGD'?'<div class="sub">≈ '+sgd(t,s.total)+' · 1 '+t.code+' = S$'+rate(t.code)+'</div>':'')+'<div class="sub">'+money(t,s.total/t.days)+' per day</div></div><div class="card">';
  Object.keys(CC).forEach(k=>{
    const pc=s.total?s[k]/s.total*100:0;
    h+='<div style="margin-bottom:10px;--c:'+CC[k]+'"><div style="display:flex;justify-content:space-between"><span>'+(CI[k]||'')+' '+k+'</span><b>'+money(t,s[k])+'</b></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';
  });
  h+='</div><div class="card"><b>Expenses</b>';
  if(!t.exp.length)h+='<div class="mute" style="margin-top:6px">Flights, food, souvenirs and more go here. Hotels and places are counted automatically.</div>';
  t.exp.forEach((e,i)=>h+='<div class="row" onclick="expForm('+i+')"><span>'+esc(e.name)+' <span class="pill" style="--c:'+(CC[e.cat]||CC.Other)+'">'+(CI[e.cat]||'')+' '+esc(e.cat)+'</span></span><b>'+money(t,+e.amt)+'</b></div>');
  return h+'</div><button class="btn w" onclick="expForm()">＋ Add expense</button>';
}
draw();
</script>
</body>
</html>
